name: Deploy to EKS

on:
  workflow_run:
    workflows:
      - Build and Push to ECR
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy
        required: true

env:
  AWS_REGION: us-west-2
  EKS_CLUSTER_NAME: EKS-Oregon
  K8S_NAMESPACE: go-app

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name $EKS_CLUSTER_NAME --region $AWS_REGION

      - name: Deploy manifests to EKS
        run: |
          kubectl apply -f k8s/namespace.yaml
          IMAGE_TAG="${{ github.event.workflow_run.head_sha || inputs.image_tag }}"
          sed "s/PLACEHOLDER_IMAGE_TAG/${IMAGE_TAG}/g" k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl rollout status deployment/go-app -n $K8S_NAMESPACE

      - name: Healthcheck application
        run: |
          kubectl run curl-test \
            --rm -i --restart=Never \
            --image=curlimages/curl:8.12.1 \
            -n $K8S_NAMESPACE \
            -- curl -fsS http://go-app-service/healthz
